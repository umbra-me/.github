<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0b12"/><stop offset="1" stop-color="#14121f"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b7cf6" stop-opacity="0"/><stop offset="1" stop-color="#8b7cf6" stop-opacity="0.9"/>
    </linearGradient>
  
  <linearGradient id="us-shield" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#7c3aed"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#7c3aed"/>
  </linearGradient>
  <linearGradient id="us-lock" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#0ea5e9"/>
  </linearGradient>
  <filter id="us-glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
  <rect width="1280" height="320" rx="16" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="16" fill="url(#grid)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#6f6894" opacity="0.8">
    <text x="860" y="92">$ git diff | axio -p "review this"</text>
    <text x="860" y="122" fill="#8b7cf6">  Read  src/main.rs</text>
    <text x="860" y="162">$ axio -c</text>
    <text x="860" y="192" fill="#8b7cf6">  continuing last session</text>
    <text x="860" y="232">$ axio profile full</text>
    <text x="860" y="262" fill="#8b7cf6">  ▍</text>
  </g>
  <rect x="254" y="176" width="220" height="3" fill="url(#fade)"/>
  <text x="252" y="150" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="72" font-weight="700" letter-spacing="10" fill="#f4f2ff">UMBRA</text>
  <text x="254" y="222" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#a9a3c9">Software that stays on your machine.</text>
  <text x="254" y="262" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#6f6894">developer tools · security · privacy</text>
<g transform="translate(76 70) scale(1.6)">
<path d="M50 8 L85 20 L85 45 C85 65 70 82 50 92 C30 82 15 65 15 45 L15 20 Z" stroke="url(#us-shield)" stroke-width="3" fill="rgba(124,58,237,0.12)" filter="url(#us-glow)"/>
<path d="M50 15 L78 25 L78 45 C78 62 65 76 50 85 C35 76 22 62 22 45 L22 25 Z" stroke="#a855f7" stroke-opacity="0.35" stroke-width="1" fill="none"/>
<g filter="url(#us-glow)" fill="none">
  <rect x="38" y="45" width="24" height="20" rx="3" stroke="url(#us-lock)" stroke-width="3"/>
  <path d="M43 45 L43 38 C43 32 47 28 50 28 C53 28 57 32 57 38 L57 45" stroke="url(#us-lock)" stroke-width="3" stroke-linecap="round"/>
</g>
<circle cx="50" cy="53" r="3" fill="#06b6d4"/>
<rect x="48.5" y="55" width="3" height="5" rx="1" fill="#06b6d4"/>
</g>
</svg>
